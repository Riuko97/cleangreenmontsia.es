# Publica la web en GitHub Pages cada vez que se sube algo a main.
# Activarlo una vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Con dominio propio: Settings → Secrets and variables → Actions → Variables →
# New repository variable: DOMINIO = cleangreenmontsia.es (sin https ni barra),
# y el mismo dominio en Settings → Pages → Custom domain.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Calcular la URL de la web
        env:
          DOMINIO: ${{ vars.DOMINIO }}
          PROPIETARIO: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$DOMINIO" ]; then
            echo "SITIO_URL=https://$DOMINIO/" >> "$GITHUB_ENV"
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            propietario=$(echo "$PROPIETARIO" | tr '[:upper:]' '[:lower:]')
            echo "SITIO_URL=https://$propietario.github.io/$REPO/" >> "$GITHUB_ENV"
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          fi

      - name: Construir la web
        run: npm run build

      - name: Auditoría SEO
        run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
